# ─── Server ──────────────────────────────────────────────────────────────
server.port=8080

# ─── MySQL DataSource ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/internhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────
# Use 'update' so Hibernate auto-creates/alters tables from entities.
# Switch to 'validate' or 'none' once schema.sql has been run manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Schema Initialisation ───────────────────────────────────────────────
# Set to 'never' — tables are managed by Hibernate ddl-auto above.
# Change to 'always' only if you want Spring Boot to run schema.sql directly.
spring.sql.init.mode=never

# ─── JWT ─────────────────────────────────────────────────────────────────
app.jwt.secret=InternHUBSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!
app.jwt.expiration=86400000

# ─── File Upload ─────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── Static Resource Serving (uploaded resumes) ──────────────────────────
spring.web.resources.static-locations=file:./uploads/,classpath:/static/

# ─── Logging ─────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.internhub=INFO
