# Spring Boot / MySQL Configuration for InternHUB

# ── Server ──────────────────────────────────────────────
server.port=8080

# ── DataSource (MySQL) ──────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/internhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=InternHUBSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024
app.jwt.expiration=86400000

# ── File Upload (Resume Storage) ─────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads/resumes

# ── CORS ─────────────────────────────────────────────────
app.cors.allowed-origin=http://localhost:5173

# ── Logging ──────────────────────────────────────────────
logging.level.com.internhub=DEBUG
logging.level.org.springframework.security=INFO
